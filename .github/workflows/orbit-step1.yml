# SPDX-License-Identifier: Apache-2.0
name: JerasolOS Orbit - Stripped 25-Driver Build & QEMU Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout JerasolOS-Orbit-Edition
        uses: actions/checkout@v4

      - name: Install build tools, pahole, busybox-static, and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev libelf-dev dwarves \
            cpio busybox-static qemu-system-x86

      - name: Cache Linux v6.12 source and compiled build
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/jerasol-orbit/linux
          key: linux-v6.12-build-v2-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            linux-v6.12-build-v2-${{ runner.os }}-

      - name: Clone Linux v6.12 if not restored from cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/jerasol-orbit"
          if [ ! -d "$HOME/jerasol-orbit/linux/.git" ]; then
            git clone --depth 1 --branch v6.12 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git "$HOME/jerasol-orbit/linux"
          fi

      - name: Configure kernel for 25 JerasolOS Orbit drivers
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/jerasol-orbit/linux"
          make x86_64_defconfig

          # x86_64 CPU, APIC interrupt routing, and QEMU direct-kernel boot support
          scripts/config \
            --enable CONFIG_SMP \
            --enable CONFIG_X86_MPPARSE \
            --enable CONFIG_X86_LOCAL_APIC \
            --enable CONFIG_X86_IO_APIC \
            --enable CONFIG_RELOCATABLE \
            --enable CONFIG_PCI_GOANY \
            --enable CONFIG_PCI_DIRECT \
            --enable CONFIG_PCI_MMCONFIG \
            --enable CONFIG_EARLY_PRINTK \
            --enable CONFIG_EARLY_PRINTK_SERIAL

          # Core 64-bit boot, ACPI, console, ELF/script execution, and virtual filesystems
          scripts/config \
            --enable CONFIG_64BIT \
            --enable CONFIG_ACPI \
            --enable CONFIG_PRINTK \
            --enable CONFIG_BINFMT_ELF \
            --enable CONFIG_BINFMT_SCRIPT \
            --enable CONFIG_TMPFS \
            --enable CONFIG_SHMEM \
            --enable CONFIG_BLK_DEV_INITRD \
            --enable CONFIG_RD_GZIP \
            --enable CONFIG_PROC_FS \
            --enable CONFIG_SYSFS \
            --enable CONFIG_DEVTMPFS \
            --enable CONFIG_DEVTMPFS_MOUNT \
            --enable CONFIG_TTY \
            --enable CONFIG_SERIAL_8250 \
            --enable CONFIG_SERIAL_8250_CONSOLE \
            --enable CONFIG_SERIAL_8250_PCI \
            --enable CONFIG_SERIAL_8250_PNP \
            --enable CONFIG_MODULES \
            --enable CONFIG_MODULE_UNLOAD \
            --enable CONFIG_USB_SUPPORT \
            --enable CONFIG_INPUT_EVDEV \
            --enable CONFIG_IOMMU_SUPPORT \
            --enable CONFIG_VSOCKETS \
            --enable CONFIG_DRM_FBDEV_EMULATION

          # Step 1 Baseline & Bus/Storage Drivers (1-6)
          scripts/config \
            --enable CONFIG_PCI \
            --enable CONFIG_BLK_DEV \
            --enable CONFIG_BLK_DEV_NVME \
            --enable CONFIG_DRM \
            --enable CONFIG_HID \
            --enable CONFIG_INPUT

          # System Plane Hardware Drivers (7-20)
          scripts/config \
            --module CONFIG_DRM_AMDGPU \
            --module CONFIG_DRM_XE \
            --enable CONFIG_I2C \
            --enable CONFIG_I2C_HID_CORE \
            --module CONFIG_I2C_HID_ACPI \
            --enable CONFIG_SPI \
            --enable CONFIG_GPIOLIB \
            --enable CONFIG_GPIO_SYSFS \
            --enable CONFIG_IIO \
            --enable CONFIG_POWER_SUPPLY \
            --enable CONFIG_BATTERY_SBS \
            --enable CONFIG_USB \
            --enable CONFIG_USB_XHCI_HCD \
            --enable CONFIG_USB_HID \
            --enable CONFIG_NET \
            --module CONFIG_CFG80211 \
            --module CONFIG_MAC80211 \
            --module CONFIG_BT \
            --enable CONFIG_SOUND \
            --module CONFIG_SND \
            --module CONFIG_SND_SOC

          # User-Plane, OS Adder & Runner Bridge Drivers (21-25)
          scripts/config \
            --enable CONFIG_VIRTIO_MENU \
            --enable CONFIG_VIRTIO_PCI \
            --enable CONFIG_VIRTIO_BLK \
            --module CONFIG_VIRTIO_CONSOLE \
            --module CONFIG_VIRTIO_NET \
            --module CONFIG_VHOST_VSOCK \
            --module CONFIG_UIO \
            --module CONFIG_VFIO \
            --module CONFIG_FUSE_FS

          make olddefconfig

      - name: Verify key driver and boot symbols survived make olddefconfig
        run: |
          cd "$HOME/jerasol-orbit/linux"
          grep -E "CONFIG_(SMP|X86_LOCAL_APIC|X86_IO_APIC|RELOCATABLE|EARLY_PRINTK_SERIAL|SERIAL_8250_CONSOLE|ACPI|RD_GZIP|NVME|DRM_AMDGPU|DRM_XE|USB_XHCI_HCD|INPUT_EVDEV|CFG80211|BT|SND_SOC|VIRTIO_PCI|VHOST_VSOCK|VFIO|FUSE_FS)=" .config

      - name: Collect in-repo custom drivers
        run: |
          mkdir -p "$HOME/jerasol-orbit/collected-drivers/src"
          if [ -d "$GITHUB_WORKSPACE/drivers" ]; then
            cp -r "$GITHUB_WORKSPACE/drivers/." "$HOME/jerasol-orbit/collected-drivers/src/"
          fi
          ls -la "$HOME/jerasol-orbit/collected-drivers/src"

      - name: Compile bzImage and kernel modules
        run: |
          cd "$HOME/jerasol-orbit/linux"
          make -j"$(nproc)" CC="gcc -std=gnu11" bzImage modules

      - name: Build in-repo driver modules if Makefile exists
        run: |
          if [ -f "$HOME/jerasol-orbit/collected-drivers/src/Makefile" ]; then
            make -C "$HOME/jerasol-orbit/linux" M="$HOME/jerasol-orbit/collected-drivers/src" CC="gcc -std=gnu11" modules
          else
            echo "No in-repo drivers/Makefile found yet; skipping external module build."
          fi

      - name: Pack initramfs with busybox-static and verify QEMU boot
        run: |
          mkdir -p "$HOME/jerasol-orbit/initramfs"/{bin,sbin,etc,proc,sys,dev,root/modules}
          cp /bin/busybox "$HOME/jerasol-orbit/initramfs/bin/busybox"
          ln -sf busybox "$HOME/jerasol-orbit/initramfs/bin/sh"
          find "$HOME/jerasol-orbit/collected-drivers/src" -name "*.ko" -exec cp {} "$HOME/jerasol-orbit/initramfs/root/modules/" \; 2>/dev/null || true

          cat <<'EOF' > "$HOME/jerasol-orbit/initramfs/init"
          #!/bin/sh
          /bin/busybox mount -t proc none /proc
          /bin/busybox mount -t sysfs none /sys
          /bin/busybox mount -t devtmpfs none /dev
          /bin/busybox echo "=== JerasolOS Orbit 25-Driver QEMU Boot OK ==="
          /bin/busybox poweroff -f
          EOF
          chmod +x "$HOME/jerasol-orbit/initramfs/init"

          (cd "$HOME/jerasol-orbit/initramfs" && find . -print0 | cpio --null -ov --format=newc | gzip -9 > "$HOME/jerasol-orbit/orbit-initramfs.cpio.gz")

          timeout 120s qemu-system-x86_64 \
            -kernel "$HOME/jerasol-orbit/linux/arch/x86/boot/bzImage" \
            -initrd "$HOME/jerasol-orbit/orbit-initramfs.cpio.gz" \
            -m 1G \
            -nographic \
            -no-reboot \
            -append "console=ttyS0,115200 earlyprintk=serial,ttyS0,115200,keep ignore_loglevel panic=1" | tee /tmp/qemu.log

          grep -q "=== JerasolOS Orbit 25-Driver QEMU Boot OK ===" /tmp/qemu.log

      - name: Upload bzImage, initramfs, and built modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jerasol-orbit-step1-artifacts
          path: |
            /home/runner/jerasol-orbit/linux/arch/x86/boot/bzImage
            /home/runner/jerasol-orbit/orbit-initramfs.cpio.gz
            /home/runner/jerasol-orbit/collected-drivers/src/*.ko
          if-no-files-found: ignore
